# Throwaway E2E override (M7, NOT committed). Disables auth and publishes the
# api port so the research-desk dev server (Vite proxy /v1 -> localhost:5100)
# can drive the live backend through the M6 data-loss regression scenarios.
# Usage:
#   podman compose -f deploy/compose/compose.stack.yaml \
#     -f deploy/compose/compose.e2e-local.yaml \
#     --env-file deploy/.env.azure.stack up -d --build api
services:
  api:
    environment:
      INQTRIX_AUTH_MODE: "none"
    ports:
      - "127.0.0.1:5100:5100"
