# Stack mode: one command to a running Research Desk.
#
#   docker compose -f deploy/compose/compose.stack.yaml \
#     --env-file deploy/.env.stack up -d --build
#
# Always pass --env-file: it feeds the ${...} interpolation below (postgres
# password, ports, the required-var guards). Compose does NOT auto-load a file
# named .env.stack. Separately, the api/worker services read the env file via
# `env_file:` so the app process sees every INQTRIX_* variable; that path
# follows ${INQTRIX_ENV_FILE} and defaults to deploy/.env.stack. The migration
# job intentionally does NOT load that shared runtime file. Compose passes only
# its interpolated INQTRIX_DATABASE_URL as the backwards-compatible fallback;
# an optional migration-only file can override it with
# INQTRIX_MIGRATION_DATABASE_URL via INQTRIX_MIGRATION_ENV_FILE.
#
# Default stack (no profile): postgres + migrate (one-shot) + api + web.
# The browser hits ONE origin (http://localhost:8080); nginx in the `web`
# container reverse-proxies /api, /v1 and /health to the `api` service, so
# there is no CORS and no VITE_INQTRIX_API_BASE_URL build-time coupling.
#
# Optional profiles (add as needed, e.g. --profile knowledge --profile workers):
#   knowledge -> qdrant (persistent/hybrid retrieval)
#   workers   -> valkey + a worker process (durable run scaling)
#   s3        -> seaweedfs (S3 object store instead of the local volume)
#   oidc      -> dex (enterprise SSO; the default is local auth)
#   collaboration -> private single-replica editor collaboration service
#                    (also set INQTRIX_COLLABORATION_ENABLED=true + a secret)
#
# Config lives in deploy/.env.stack (copy from deploy/.env.stack.example).
# To use a different file per setup, both mechanisms above must read it: add a
# line INQTRIX_ENV_FILE=<path> inside that file (so `env_file:` follows it), and
# pass the same path to --env-file (for ${...} interpolation). Example:
#   # deploy/.env.azure.stack contains: INQTRIX_ENV_FILE=deploy/.env.azure.stack
#   docker compose -f deploy/compose/compose.stack.yaml \
#     --env-file deploy/.env.azure.stack up -d --build
#
# Image policy (binding): same as compose.dev.yaml — only Docker Official
# Images or Docker-Sponsored OSS, always tag + digest pinned. Reuse the
# digests verified for the dev stack; refresh deliberately.

name: inqtrix

services:
  postgres:
    # Docker Official Image, PostgreSQL 18.4 on Debian Trixie (digest from
    # compose.dev.yaml). Not published on a host port: only the api/migrate/
    # worker services reach it over the compose network. Back up via
    # `compose exec postgres pg_dump` (see docs/deployment/runbooks.md).
    image: docker.io/library/postgres:18.4-trixie@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    environment:
      POSTGRES_USER: ${INQTRIX_PG_USER:-inqtrix}
      POSTGRES_PASSWORD: ${INQTRIX_PG_PASSWORD:?set INQTRIX_PG_PASSWORD in deploy/.env.stack}
      POSTGRES_DB: ${INQTRIX_PG_DB:-inqtrix}
    volumes:
      # postgres:18 moved PGDATA into a version-scoped subdir and declares
      # VOLUME /var/lib/postgresql — mount the named volume THERE.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  pgbouncer:
    # Optional transaction-mode connection pooler in front of Postgres
    # (--profile pgbouncer). Opt in by ALSO pointing INQTRIX_DATABASE_URL at
    # pgbouncer:6432 (see deploy/.env.stack.example); migrate below stays
    # wired directly to postgres:5432 (DDL does not multiplex).
    # IMAGE-POLICY EXCEPTION (maintainer decision pending): PgBouncer has no
    # Docker Official or Docker-Sponsored image. edoburu/pgbouncer is the
    # de-facto community standard (non-root, env-configured); swap the pin
    # here if the maintainer prefers another provenance.
    # MAX_PREPARED_STATEMENTS (pgbouncer >= 1.21) makes asyncpg's named
    # prepared statements safe under transaction pooling; the URL-side
    # ?prepared_statement_cache_size=0 in the example env is belt-and-braces.
    profiles: ["pgbouncer"]
    image: docker.io/edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${INQTRIX_PG_USER:-inqtrix}
      DB_PASSWORD: ${INQTRIX_PG_PASSWORD:?set INQTRIX_PG_PASSWORD in deploy/.env.stack}
      DB_NAME: ${INQTRIX_PG_DB:-inqtrix}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "400"
      DEFAULT_POOL_SIZE: "20"
      MAX_PREPARED_STATEMENTS: "200"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
        # `required: false` (here and on every other postgres dependency)
        # keeps the default stack byte-identical while the bundled service
        # runs, but lets compose.external-db.yaml deactivate it: a skipped
        # optional dependency only warns instead of failing the deployment.
        required: false
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    # One-shot schema migration. Runs the packaged Alembic migrations to head
    # and exits 0. Compose starts it automatically and the api/worker wait for
    # successful completion; an operator does not normally invoke it by hand.
    # The packaged command remains available only for break-glass recovery.
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    command: ["inqtrix-migrate"]
    env_file:
      # /dev/null keeps bundled installs compatible with the runtime-DSN
      # fallback. Once an operator supplies INQTRIX_MIGRATION_ENV_FILE, a typo
      # is fatal instead of silently ignoring the dedicated credential.
      - path: ${INQTRIX_MIGRATION_ENV_FILE:-/dev/null}
        required: true
    environment:
      # The runtime DSN from Compose interpolation is the compatibility
      # fallback for BOTH bundled and managed PostgreSQL. Never substitute a
      # hard-coded bundled host here: API/worker could otherwise start against
      # an unmigrated managed schema. Managed deployments and every PgBouncer
      # runtime must override this through the migration-only env file with a
      # direct INQTRIX_MIGRATION_DATABASE_URL.
      INQTRIX_DATABASE_URL: ${INQTRIX_DATABASE_URL:?set INQTRIX_DATABASE_URL in the Compose --env-file}
      INQTRIX_MIGRATION_RLS_MODE: ${INQTRIX_MIGRATION_RLS_MODE:-auto}
      INQTRIX_MIGRATION_SERVICES_QUIESCED: ${INQTRIX_MIGRATION_SERVICES_QUIESCED:-false}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"

  api:
    # The FastAPI server (python -m inqtrix) on the internal network port
    # 5100. Not published on the host: the web container is the only ingress.
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    env_file:
      - ../../${INQTRIX_ENV_FILE:-deploy/.env.stack}
    environment:
      INQTRIX_SERVER_HOST: "0.0.0.0"
      INQTRIX_SERVER_PORT: "5100"
      INQTRIX_OBJECT_STORE_BACKEND: ${INQTRIX_OBJECT_STORE_BACKEND:-local}
      INQTRIX_OBJECT_STORE_PATH: /var/lib/inqtrix/objects
      INQTRIX_DATABASE_RUNTIME_LOGIN_POLICY: ${INQTRIX_DATABASE_RUNTIME_LOGIN_POLICY:-bundled_legacy}
      # env_file is operator-controlled. Never let a mistakenly reused
      # migration-only env expose its privileged DSN to the runtime process.
      INQTRIX_MIGRATION_DATABASE_URL: ""
      # Private service-network addresses. They are inert while
      # INQTRIX_COLLABORATION_ENABLED remains false, preserving the default
      # stack while making the collaboration profile deterministic.
      INQTRIX_COLLABORATION_HTTP_URL: http://collaboration:1234
      INQTRIX_COLLABORATION_WS_URL: ws://collaboration:1234/collaboration
    volumes:
      - objectstore:/var/lib/inqtrix/objects
      - type: bind
        source: ${INQTRIX_S3_CA_BUNDLE_HOST:-/dev/null}
        target: /etc/inqtrix/object-store/ca.pem
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The slim python image ships no curl; probe with the stdlib instead.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5100/readyz').status==200 else 1)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  web:
    # nginx serving the built React bundle + reverse-proxying the API. The
    # single host ingress. It stays bound to loopback by default; set
    # INQTRIX_WEB_BIND_ADDRESS=0.0.0.0 for an explicit LAN test or put a TLS
    # reverse proxy in front for production remote access (see
    # docs/how-to/deploy-to-production.md).
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    environment:
      # This is the trusted scheme nginx sends to FastAPI; it never consumes an
      # incoming X-Forwarded-Proto. Keep the HTTP default for loopback. A TLS
      # proxy deployment must set this to https alongside an exact
      # INQTRIX_PUBLIC_BASE_URL in the shared stack environment.
      INQTRIX_EXTERNAL_SCHEME: ${INQTRIX_EXTERNAL_SCHEME:-http}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${INQTRIX_WEB_BIND_ADDRESS:-127.0.0.1}:${INQTRIX_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  collaboration:
    # Optional single-writer editor collaboration service. FastAPI remains the
    # only browser-facing WebSocket gateway; this container has no host port.
    # It receives a deliberately narrow environment rather than env_file, so
    # database, auth-session, provider, and object-store credentials never
    # enter the Node process. The service validates the secret and API URL at
    # startup and fails loudly when the profile is enabled incompletely.
    profiles: ["collaboration"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.collaboration
    user: "1001:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      INQTRIX_API_INTERNAL_URL: http://api:5100
      INQTRIX_COLLABORATION_AWARENESS_RATE_PER_SECOND: ${INQTRIX_COLLABORATION_AWARENESS_RATE_PER_SECOND:-20}
      INQTRIX_COLLABORATION_BIND_ADDRESS: "0.0.0.0"
      INQTRIX_COLLABORATION_HTTP_TIMEOUT_MS: ${INQTRIX_COLLABORATION_HTTP_TIMEOUT_MS:-5000}
      INQTRIX_COLLABORATION_INSTANCE_LEASE_SECONDS: ${INQTRIX_COLLABORATION_INSTANCE_LEASE_SECONDS:-15}
      INQTRIX_COLLABORATION_INSTANCE_RENEW_SECONDS: ${INQTRIX_COLLABORATION_INSTANCE_RENEW_SECONDS:-5}
      INQTRIX_COLLABORATION_MAINTENANCE_INTERVAL_SECONDS: ${INQTRIX_COLLABORATION_MAINTENANCE_INTERVAL_SECONDS:-60}
      INQTRIX_COLLABORATION_MAX_DOCUMENT_BYTES: ${INQTRIX_COLLABORATION_MAX_DOCUMENT_BYTES:-10485760}
      INQTRIX_COLLABORATION_MAX_FRAME_BYTES: ${INQTRIX_COLLABORATION_MAX_FRAME_BYTES:-2097152}
      INQTRIX_COLLABORATION_MAX_QUEUED_BYTES: ${INQTRIX_COLLABORATION_MAX_QUEUED_BYTES:-8388608}
      INQTRIX_COLLABORATION_MAX_QUEUED_FRAMES: ${INQTRIX_COLLABORATION_MAX_QUEUED_FRAMES:-32}
      INQTRIX_COLLABORATION_MAX_SESSIONS_PER_USER_DOCUMENT: ${INQTRIX_COLLABORATION_MAX_SESSIONS_PER_USER_DOCUMENT:-5}
      INQTRIX_COLLABORATION_POLICY_POLL_MS: ${INQTRIX_COLLABORATION_POLICY_POLL_MS:-2000}
      INQTRIX_COLLABORATION_POLICY_REVALIDATION_TIMEOUT_MS: ${INQTRIX_COLLABORATION_POLICY_REVALIDATION_TIMEOUT_MS:-7500}
      INQTRIX_COLLABORATION_PORT: "1234"
      INQTRIX_COLLABORATION_RECONCILE_MAX_HASHES: ${INQTRIX_COLLABORATION_RECONCILE_MAX_HASHES:-256}
      INQTRIX_COLLABORATION_RECONCILE_RATE_COUNT: ${INQTRIX_COLLABORATION_RECONCILE_RATE_COUNT:-10}
      INQTRIX_COLLABORATION_RECONCILE_RATE_WINDOW_SECONDS: ${INQTRIX_COLLABORATION_RECONCILE_RATE_WINDOW_SECONDS:-10}
      INQTRIX_COLLABORATION_SECRET: ${INQTRIX_COLLABORATION_SECRET:-}
      INQTRIX_COLLABORATION_SNAPSHOT_IDLE_SECONDS: ${INQTRIX_COLLABORATION_SNAPSHOT_IDLE_SECONDS:-5}
      INQTRIX_COLLABORATION_SNAPSHOT_RETRY_BASE_MS: ${INQTRIX_COLLABORATION_SNAPSHOT_RETRY_BASE_MS:-1000}
      INQTRIX_COLLABORATION_SNAPSHOT_RETRY_MAX_MS: ${INQTRIX_COLLABORATION_SNAPSHOT_RETRY_MAX_MS:-30000}
      INQTRIX_COLLABORATION_SNAPSHOT_TAIL_BYTES: ${INQTRIX_COLLABORATION_SNAPSHOT_TAIL_BYTES:-1048576}
      INQTRIX_COLLABORATION_SNAPSHOT_UPDATE_COUNT: ${INQTRIX_COLLABORATION_SNAPSHOT_UPDATE_COUNT:-256}
      INQTRIX_COLLABORATION_SOCKET_BACKPRESSURE_BYTES: ${INQTRIX_COLLABORATION_SOCKET_BACKPRESSURE_BYTES:-4194304}
      INQTRIX_COLLABORATION_TENANT_ID: ${INQTRIX_COLLABORATION_TENANT_ID:-default}
      INQTRIX_COLLABORATION_UPDATE_RATE_COUNT: ${INQTRIX_COLLABORATION_UPDATE_RATE_COUNT:-120}
      INQTRIX_COLLABORATION_UPDATE_RATE_WINDOW_SECONDS: ${INQTRIX_COLLABORATION_UPDATE_RATE_WINDOW_SECONDS:-10}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1234/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  worker:
    # Durable-run worker. Enable with --profile workers together with
    # INQTRIX_QUEUE_BACKEND=valkey + INQTRIX_VALKEY_URL in deploy/.env.stack.
    # Shares the object-store volume so worker runs reach uploaded blobs.
    profiles: ["workers"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    command: ["inqtrix-worker"]
    env_file:
      - ../../${INQTRIX_ENV_FILE:-deploy/.env.stack}
    environment:
      INQTRIX_OBJECT_STORE_BACKEND: ${INQTRIX_OBJECT_STORE_BACKEND:-local}
      INQTRIX_OBJECT_STORE_PATH: /var/lib/inqtrix/objects
      INQTRIX_DATABASE_RUNTIME_LOGIN_POLICY: ${INQTRIX_DATABASE_RUNTIME_LOGIN_POLICY:-bundled_legacy}
      INQTRIX_MIGRATION_DATABASE_URL: ""
      # Same private collaboration addresses as the api service: the worker
      # loads the SAME shared env file, so with
      # INQTRIX_COLLABORATION_ENABLED=true its settings validation requires
      # coherent URLs too (without these the worker crash-loops and queued
      # runs are never claimed). Inert while the flag stays false.
      INQTRIX_COLLABORATION_HTTP_URL: http://collaboration:1234
      INQTRIX_COLLABORATION_WS_URL: ws://collaboration:1234/collaboration
    volumes:
      - objectstore:/var/lib/inqtrix/objects
      - type: bind
        source: ${INQTRIX_S3_CA_BUNDLE_HOST:-/dev/null}
        target: /etc/inqtrix/object-store/ca.pem
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    # Persistent/hybrid knowledge store. Enable with --profile knowledge +
    # INQTRIX_KNOWLEDGE_ENABLED=true, INQTRIX_VECTOR_BACKEND=qdrant,
    # INQTRIX_QDRANT_URL=http://qdrant:6333 in deploy/.env.stack.
    image: docker.io/qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    profiles: ["knowledge"]
    environment:
      QDRANT__SERVICE__API_KEY: ${INQTRIX_QDRANT_API_KEY:-inqtrix-qdrant-key}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  valkey:
    # Job-queue broker for the workers profile.
    image: docker.io/valkey/valkey:9.1.0@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    profiles: ["workers"]
    command: >-
      valkey-server
      --requirepass ${INQTRIX_VALKEY_PASSWORD:-change-me-valkey-password}
      --appendonly yes
      --appendfsync everysec
      --save 3600 1
    environment:
      INQTRIX_VALKEY_PASSWORD: ${INQTRIX_VALKEY_PASSWORD:-change-me-valkey-password}
    volumes:
      - valkey_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "valkey-cli -a $${INQTRIX_VALKEY_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  seaweedfs:
    # S3 object store (alternative to the default local volume). Enable with
    # --profile s3 + INQTRIX_OBJECT_STORE_BACKEND=s3 and the S3 creds.
    image: docker.io/chrislusf/seaweedfs:4.33@sha256:f0b358973e81f884304737645dd3b278c590c2c9d47d60089729d46324f70495
    profiles: ["s3"]
    command: >-
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  dex:
    # Reference OIDC IdP for the enterprise oidc profile (the default
    # is local auth). Any OIDC-compliant provider works; Dex is only the dev
    # reference. Enable with --profile oidc + INQTRIX_AUTH_MODE=oidc.
    image: ghcr.io/dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
    profiles: ["oidc"]
    environment:
      DEX_INQTRIX_CLIENT_SECRET: ${INQTRIX_OIDC_CLIENT_SECRET:-inqtrix-oidc-secret}
    volumes:
      - ./dex-config.yaml:/etc/dex/config.yaml:ro
      - dex_data:/var/dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5556/dex/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  lldap:
    # Reference LDAP directory for the enterprise ldap profile (the
    # default is local auth). Any RFC 4511 directory works; LLDAP is only
    # the dev/demo reference. Enable with --profile ldap + INQTRIX_AUTH_MODE=
    # ldap and point INQTRIX_LDAP_URL at ldap://lldap:3890 (the api reaches
    # it over the compose network; only the setup web UI is published).
    image: lldap/lldap:stable@sha256:2a8454b668c1aba7157e832eab0e242e1e7eb5fb7591d7e7774ba05286511ca8
    profiles: ["ldap"]
    environment:
      LLDAP_LDAP_BASE_DN: "dc=example,dc=com"
      LLDAP_LDAP_USER_PASS: ${INQTRIX_LDAP_BIND_PASSWORD:-inqtrix-ldap-password}
      LLDAP_JWT_SECRET: ${INQTRIX_LLDAP_JWT_SECRET:-inqtrix-lldap-jwt-secret}
      LLDAP_KEY_SEED: ${INQTRIX_LLDAP_KEY_SEED:-inqtrix-lldap-key-seed}
    ports:
      - "127.0.0.1:${INQTRIX_LLDAP_WEB_PORT:-17170}:17170"
    volumes:
      - lldap_data:/data
    healthcheck:
      test: ["CMD", "/app/lldap", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  # The api/worker now run as non-root (UID 1001, group 0). A FRESH objectstore
  # volume inherits the image directory's group-0-writable permissions. If you
  # are upgrading a stack that ran the OLD root image, the existing volume is
  # root-owned; fix it ONCE before the first non-root start (or recreate it):
  #   docker compose run --rm --user 0 api \
  #     sh -c 'chgrp -R 0 /var/lib/inqtrix/objects && chmod -R g=u /var/lib/inqtrix/objects'
  objectstore:
  qdrant_storage:
  valkey_data:
  seaweedfs_data:
  dex_data:
  lldap_data:
