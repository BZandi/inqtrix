{{- /*
Non-secret app config. Bundled backing services auto-wire their non-secret
connection settings; anything set explicitly in config/extraConfig wins (merge
precedence: config > extraConfig > derived).
*/}}
{{- /* Fail fast: postgres storage backend with no database configured would
       render an empty INQTRIX_DATABASE_URL and break migrate + api at runtime. */}}
{{- if and (eq (.Values.config.INQTRIX_STORAGE_BACKEND | toString) "postgres") (not .Values.postgres.enabled) (not .Values.secret.existingSecret) (not (hasKey .Values.secret.data "INQTRIX_DATABASE_URL")) }}
{{- fail "INQTRIX_STORAGE_BACKEND is \"postgres\" but no database is configured. Set ONE of: --set postgres.enabled=true (bundled demo DB), --set secret.existingSecret=<name> (a Secret carrying INQTRIX_DATABASE_URL), or --set-string secret.data.INQTRIX_DATABASE_URL=<url>. For a stateless trial: --set config.INQTRIX_STORAGE_BACKEND=memory --set migrations.enabled=false." }}
{{- end }}
{{- /* Effective replica count: static replicaCount, or the autoscaler ceiling
       when enabled; a worker pod counts as one more sharer of the object store. */}}
{{- $apiReplicas := int .Values.api.replicaCount }}
{{- if .Values.api.autoscaling.enabled }}
{{- $apiReplicas = int .Values.api.autoscaling.maxReplicas }}
{{- end }}
{{- $storeSharers := $apiReplicas }}
{{- if .Values.worker.enabled }}
{{- $storeSharers = add $storeSharers 1 }}
{{- end }}
{{- /* Fail fast: the local object store is per-pod disk. More than one sharer
       (api replicas and/or a worker) silently 404s every blob on the pods that
       did not write it -- refuse the render, mirroring the app's own startup
       guard on INQTRIX_REPLICA_COUNT. */}}
{{- $explicitStore := coalesce .Values.config.INQTRIX_OBJECT_STORE_BACKEND .Values.extraConfig.INQTRIX_OBJECT_STORE_BACKEND "" }}
{{- $effectiveStore := $explicitStore }}
{{- if not $effectiveStore }}
{{- $effectiveStore = ternary "s3" "local" .Values.s3.enabled }}
{{- end }}
{{- if and (eq ($effectiveStore | toString) "local") (gt (int $storeSharers) 1) }}
{{- fail (printf "Object store backend \"local\" is per-pod disk but %d pods would share it (api replicas/autoscaling max + worker). Enable an S3 backend: --set s3.enabled=true (bundled MinIO demo) or set config.INQTRIX_OBJECT_STORE_BACKEND=s3 with an external endpoint." (int $storeSharers)) }}
{{- end }}
{{- /* Object-store backend default lives in the derived layer (not the config
       defaults) so s3.enabled can flip it to "s3" -- a baked-in config default would
       always win over the derived value. The app default is "local" too. An explicit
       config/extraConfig value still wins (e.g. to point at an external S3). The
       replica hint feeds the app's own startup guard (defense in depth for
       non-Helm deploys). */}}
{{- $runtimeLoginPolicy := ternary "bundled_legacy" "restricted" .Values.postgres.enabled }}
{{- $derived := dict "INQTRIX_OBJECT_STORE_BACKEND" "local" "INQTRIX_REPLICA_COUNT" (printf "%d" (int $storeSharers)) "INQTRIX_DATABASE_RUNTIME_LOGIN_POLICY" $runtimeLoginPolicy }}
{{- $explicitPublicBase := coalesce .Values.config.INQTRIX_PUBLIC_BASE_URL .Values.extraConfig.INQTRIX_PUBLIC_BASE_URL "" }}
{{- /* OpenShift assigns route.host only after admission when it is empty. The
       chart cannot derive a trust anchor from a value that does not yet exist,
       so collaboration must receive the final origin explicitly instead of
       rendering a deployment whose TLS WebSockets always fail origin checks. */}}
{{- if and .Values.collaboration.enabled .Values.openshift.enabled .Values.route.enabled (not .Values.route.host) (not $explicitPublicBase) }}
{{- fail "Collaboration with an automatically assigned OpenShift Route host requires config.INQTRIX_PUBLIC_BASE_URL (or extraConfig.INQTRIX_PUBLIC_BASE_URL) set to the final public origin. Alternatively set route.host explicitly." }}
{{- end }}
{{- /* The public URL is a trust anchor for same-origin WebSocket checks after
       TLS termination. Derive it only from the chart-owned ingress/Route;
       explicit config or extraConfig still wins through merge precedence. */}}
{{- if and .Values.ingress.enabled (not .Values.openshift.enabled) }}
{{- $publicScheme := ternary "https" "http" .Values.ingress.tls.enabled }}
{{- $_ := set $derived "INQTRIX_PUBLIC_BASE_URL" (printf "%s://%s" $publicScheme .Values.ingress.host) }}
{{- else if and .Values.openshift.enabled .Values.route.enabled .Values.route.host }}
{{- $publicScheme := ternary "https" "http" .Values.route.tls.enabled }}
{{- $_ := set $derived "INQTRIX_PUBLIC_BASE_URL" (printf "%s://%s" $publicScheme .Values.route.host) }}
{{- end }}
{{- if .Values.qdrant.enabled }}
{{- $_ := set $derived "INQTRIX_KNOWLEDGE_ENABLED" "true" }}
{{- $_ := set $derived "INQTRIX_VECTOR_BACKEND" "qdrant" }}
{{- $_ := set $derived "INQTRIX_QDRANT_URL" (printf "http://%s-qdrant:6333" (include "inqtrix.fullname" .)) }}
{{- end }}
{{- /* Only switch to the Valkey queue when a worker exists to drain it; otherwise
       a bundled Valkey without a worker would leave runs queued forever. With no
       worker the app keeps the in-process queue (fine for a single-pod demo). */}}
{{- if and .Values.valkey.enabled .Values.worker.enabled }}
{{- $_ := set $derived "INQTRIX_QUEUE_BACKEND" "valkey" }}
{{- end }}
{{- /* Bundled MinIO: point the object store at the in-cluster S3 endpoint and
       retain the historical static/path-style/create-if-missing contract. The
       access/secret keys are derived into the Secret. */}}
{{- if .Values.s3.enabled }}
{{- $_ := set $derived "INQTRIX_OBJECT_STORE_BACKEND" "s3" }}
{{- $_ := set $derived "INQTRIX_S3_AUTH_MODE" "static" }}
{{- $_ := set $derived "INQTRIX_S3_ENDPOINT_URL" (printf "http://%s-minio:9000" (include "inqtrix.fullname" .)) }}
{{- $_ := set $derived "INQTRIX_S3_BUCKET" .Values.s3.bucket }}
{{- $_ := set $derived "INQTRIX_S3_ADDRESSING_STYLE" "path" }}
{{- $_ := set $derived "INQTRIX_S3_BUCKET_PROVISIONING" "create_if_missing" }}
{{- end }}
{{- if .Values.s3.caBundle.existingConfigMap }}
{{- $_ := set $derived "INQTRIX_S3_CA_BUNDLE" .Values.s3.caBundle.mountPath }}
{{- end }}
{{- /* Prometheus /metrics: the image bakes in the metrics extra, so this flag
       alone mounts the endpoint (scrape wiring lives on the api pod annotations). */}}
{{- if .Values.metrics.enabled }}
{{- $_ := set $derived "INQTRIX_METRICS_ENABLED" "true" }}
{{- end }}
{{- /* Collaboration stays absent from the default ConfigMap. Enabling the
       module wires FastAPI only to the private ClusterIP Service; the browser
       continues to use the same-origin /collaboration gateway. */}}
{{- if .Values.collaboration.enabled }}
{{- $_ := set $derived "INQTRIX_COLLABORATION_ENABLED" "true" }}
{{- $_ := set $derived "INQTRIX_COLLABORATION_HTTP_URL" (printf "http://%s-collaboration:%d" (include "inqtrix.fullname" .) (int .Values.service.collaborationPort)) }}
{{- $_ := set $derived "INQTRIX_COLLABORATION_WS_URL" (printf "ws://%s-collaboration:%d/collaboration" (include "inqtrix.fullname" .) (int .Values.service.collaborationPort)) }}
{{- end }}
{{- $merged := merge (deepCopy .Values.config) .Values.extraConfig $derived }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inqtrix.fullname" . }}
  labels:
    {{- include "inqtrix.labels" (dict "root" .) | nindent 4 }}
data:
  {{- range $key, $value := $merged }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
