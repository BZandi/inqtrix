apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inqtrix.fullname" . }}-web
  labels:
    {{- include "inqtrix.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "inqtrix.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inqtrix.labels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "inqtrix.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "inqtrix.podSecurityContext" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "inqtrix.image.web" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # The nginx config template resolves this to the API Service DNS at
            # container start (envsubst). Single origin: nginx proxies /api, /v1
            # and /health to the API.
            - name: INQTRIX_API_UPSTREAM
              value: "{{ include "inqtrix.fullname" . }}-api:{{ .Values.service.apiPort }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.webPort }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            {{- include "inqtrix.webWritableVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "inqtrix.webWritableVolumes" . | nindent 8 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
