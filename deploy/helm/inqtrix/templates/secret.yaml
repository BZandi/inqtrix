{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- /*
Chart-managed Secret (dev convenience). Bundled backing services auto-wire their
secret connection settings; anything in secret.data wins (merge precedence:
secret.data > derived).
*/}}
{{- /* Route URL construction through the helpers (single source) so their
       password-charset guards always apply -- do NOT rebuild the URLs inline. */}}
{{- $derived := dict }}
{{- if .Values.postgres.enabled }}
{{- $_ := set $derived "INQTRIX_DATABASE_URL" (include "inqtrix.databaseUrl" .) }}
{{- end }}
{{- if .Values.valkey.enabled }}
{{- $_ := set $derived "INQTRIX_VALKEY_URL" (include "inqtrix.valkeyUrl" .) }}
{{- end }}
{{- if and .Values.qdrant.enabled .Values.qdrant.apiKey }}
{{- $_ := set $derived "INQTRIX_QDRANT_API_KEY" .Values.qdrant.apiKey }}
{{- end }}
{{- if .Values.s3.enabled }}
{{- $_ := set $derived "INQTRIX_S3_ACCESS_KEY" .Values.s3.accessKey }}
{{- $_ := set $derived "INQTRIX_S3_SECRET_KEY" .Values.s3.secretKey }}
{{- end }}
{{- $merged := merge (deepCopy .Values.secret.data) $derived }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inqtrix.fullname" . }}
  labels:
    {{- include "inqtrix.labels" (dict "root" .) | nindent 4 }}
type: Opaque
{{- with $merged }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
