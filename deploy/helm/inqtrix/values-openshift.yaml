# Example overlay for Red Hat OpenShift.
#
#   helm install inqtrix deploy/helm/inqtrix \
#     -f deploy/helm/inqtrix/values-openshift.yaml \
#     --set image.registry=image-registry.openshift-image-registry.svc:5000/<project> \
#     --set image.api.digest=sha256:<API-DIGEST> \
#     --set image.web.digest=sha256:<WEB-DIGEST> \
#     --set-string secret.data.INQTRIX_DATABASE_URL=postgresql+asyncpg://...
#
# openshift.enabled=true makes the chart render a Route (instead of an Ingress)
# and OMIT runAsUser/runAsGroup/fsGroup so the restricted-v2 SCC assigns its own
# arbitrary UID with supplemental GID 0. No SCC changes are needed: the images
# run non-root, bind ports >1024 and write only to mounted volumes.
#
# Bundled backing services on OpenShift: qdrant, valkey and s3 (MinIO) run fine
# under the arbitrary UID, so you may add `--set qdrant.enabled=true`,
# `--set valkey.enabled=true` and `--set s3.enabled=true` for a turnkey demo. When
# secret.existingSecret is used, include the derived secret values in that Secret
# yourself (for example INQTRIX_VALKEY_URL and INQTRIX_S3_ACCESS_KEY/SECRET_KEY);
# the chart cannot mutate a user-managed Secret. The bundled Postgres is the
# exception (its image needs a fixed UID) -- keep it OFF here and point
# INQTRIX_DATABASE_URL at an external/managed database.
#
# Managed PostgreSQL upgrades should give only the migration hook a direct,
# dedicated DSN. Configure migrations.databaseSecret.name/key and choose
# migrations.rlsMode=bypass or owner. For every installed-schema upgrade,
# migrations.maintenanceConfirmed=true authorizes the chart's narrow
# pre-upgrade hook to scale API/worker/collaboration and chart-owned PgBouncer
# to zero and wait for their pods to terminate before the migration job. The
# hook revokes its own
# RoleBinding before exit; API autoscaling is reactivated with minReplicas only
# after the migration succeeds.
#
# ROSA/OpenShift workload identity for managed S3 belongs only on the API and
# worker ServiceAccounts. Configure serviceAccount.api/worker independently;
# leave the shared account tokenless for web/collaboration. For NooBaa or
# private S3-compatible endpoints, s3.caBundle may reference a ConfigMap that
# is mounted only into API/worker.
openshift:
  enabled: true

route:
  enabled: true
  # Leave host empty to let OpenShift generate one from the project/app name.
  host: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
