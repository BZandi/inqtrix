# Default values for the Inqtrix chart.
#
# This file is the single source of truth for every knob; the deployment guide
# (docs/deployment/kubernetes.md) references these keys rather than repeating
# them. Defaults target a PRODUCTION posture: external PostgreSQL, no bundled
# backing services, a restricted-v2-compatible security context. Flip the
# *.enabled flags below for a self-contained turnkey demo.

# -- First-party container images. Production references require an immutable
# sha256 digest. Local development may deliberately opt into tag-only images
# with image.allowUnpinned=true. Tags remain in pinned references for readable
# diagnostics: registry/repository:tag@sha256:...
image:
  registry: ghcr.io/bzandi
  pullPolicy: IfNotPresent
  allowUnpinned: false
  api:
    repository: inqtrix-api
    tag: ""
    digest: ""
  web:
    repository: inqtrix-web
    tag: ""
    digest: ""
  collaboration:
    repository: inqtrix-collaboration
    tag: ""
    digest: ""
# -- Names of image-pull Secrets when the registry is private
# (kubectl create secret docker-registry ...).
imagePullSecrets: []

# -- OpenShift mode. When true: a Route is rendered instead of an Ingress, and
# runAsUser/runAsGroup/fsGroup are OMITTED so the restricted-v2 SCC can assign
# its own arbitrary UID and supplemental GID 0. Leave false for vanilla
# Kubernetes (where a fixed non-root UID and fsGroup are set for PVC ownership).
openshift:
  enabled: false

nameOverride: ""
fullnameOverride: ""

# -- Non-secret application configuration. Every key here is rendered verbatim
# into a ConfigMap and injected into the api/worker pods via envFrom, so
# the names must match Inqtrix settings exactly (see src/inqtrix/settings.py and
# docs/configuration/settings-and-env.md). Secrets do NOT belong here -- use the
# `secret` block below.
config:
  INQTRIX_STORAGE_BACKEND: postgres
  INQTRIX_AUTH_MODE: infer
  INQTRIX_SERVER_HOST: "0.0.0.0"
  INQTRIX_SERVER_PORT: "5100"
  # INQTRIX_OBJECT_STORE_BACKEND is derived, not baked here: local by default, s3 when
  # s3.enabled bundles MinIO (see configmap.yaml). Set it here explicitly ONLY to point
  # at an external S3 endpoint (an explicit config value still wins over the derived one).
  INQTRIX_OBJECT_STORE_PATH: /var/lib/inqtrix/objects
  # Pooled-engine connection budget. The pooled-engine count is CONDITIONAL:
  # the API builds 2 always (platform bundle + run store), +1 for a
  # cookie-session auth mode (local/ldap/oidc), +1 when knowledge is enabled
  # (up to 4); the worker builds 1, +1 when knowledge is enabled (up to 2).
  # Worst case per process = pooled_engines x (POOL_SIZE + MAX_OVERFLOW); each
  # process logs its actual computed number at startup. Size the sum over ALL
  # replicas below Postgres max_connections, or front the database with a
  # transaction pooler (pgbouncer.enabled below). Defaults: 5 / 10 / 30.
  # INQTRIX_DATABASE_POOL_SIZE: "5"
  # INQTRIX_DATABASE_POOL_MAX_OVERFLOW: "10"
  # INQTRIX_DATABASE_POOL_TIMEOUT_SECONDS: "30"
# -- Free-form extra non-secret env merged into the ConfigMap (provider models,
# feature flags, OIDC issuer/client-id, LDAP DNs, tuning -- anything non-secret).
extraConfig: {}

# -- Secret values (DB URL, session/PAT/pseudonym secrets, OIDC client secret,
# LDAP bind password, S3/Qdrant/LLM keys -- the fields settings.py marks
# secret). INQTRIX_PSEUDONYM_PEPPER belongs here too: the Secret reaches API
# and worker pods alike, which is exactly the sharing the stable log
# pseudonyms require (required for oidc mode).
secret:
  # When create=true and existingSecret is empty, the chart renders a Secret
  # from `data` below. For PRODUCTION bring your own Secret instead and set
  # existingSecret to its name (the chart-managed path is a dev convenience).
  create: true
  existingSecret: ""
  # key: value pairs placed into the chart-managed Secret. Provide via
  # --set-string secret.data.INQTRIX_DATABASE_URL=... or a values override; do
  # NOT commit real secrets into a values file.
  data: {}

# -- Prometheus /metrics endpoint on the API pods. Off by default. Sets
# INQTRIX_METRICS_ENABLED and, when podAnnotations is true, the
# prometheus.io/scrape annotations for an annotation-based Prometheus. The
# series carry no run-id/subject/session labels. When an API key is set (auth
# apikey mode), /metrics is Bearer-gated with that key; otherwise keep it
# cluster-internal (this endpoint is not exposed through the web Ingress).
metrics:
  enabled: false
  # Emit prometheus.io/{scrape,port,path} pod annotations (classic scrape
  # config). Set false when you use a PodMonitor/ServiceMonitor CR instead.
  podAnnotations: true
  # Worker-process exporter: each worker pod serves its OWN registry on this
  # port (INQTRIX_WORKER_METRICS_PORT; no pushgateway — scrape every replica).
  # 0 keeps the worker without an exporter. Requires metrics.enabled=true.
  workerPort: 0

# -- OpenTelemetry trace export for the agentic runs (INQTRIX_TRACING).
# Off by default (spans then only correlate JSON log lines when the app
# enables local mode itself). The MINIMAL enterprise path is an EXISTING
# Langfuse server: set enabled + otlpEndpoint + headersSecret — no
# in-cluster deployment needed. To co-deploy Langfuse, install the
# official `langfuse` chart (repo https://langfuse.github.io/langfuse-k8s)
# as a SEPARATE release and point otlpEndpoint at its service; recipe and
# OpenShift notes in docs/deployment/kubernetes.md.
observability:
  tracing:
    enabled: false
    # off | local | file | otlp — the sink INQTRIX_TRACING is set to when
    # enabled. otlp needs otlpEndpoint; the API server and the worker get
    # identical settings (one trace spans both).
    mode: "otlp"
    # OTLP/HTTP base endpoint, e.g. for Langfuse:
    # http://langfuse-web.langfuse.svc:3000/api/public/otel
    otlpEndpoint: ""
    # Secret carrying the FULL OTEL_EXPORTER_OTLP_HEADERS value, e.g.
    # "Authorization=Basic <base64(pk-lf-…:sk-lf-…)>,x-langfuse-ingestion-version=4"
    # (the second pair is required for real-time display in Langfuse).
    headersSecret:
      name: ""
      key: "OTEL_EXPORTER_OTLP_HEADERS"
    # Head-sampling ratio (INQTRIX_TRACE_SAMPLE_RATE); 1.0 keeps everything.
    sampleRate: ""
    # Browser base URL of the Langfuse UI (INQTRIX_TRACE_UI_URL) for the
    # admin "open trace" deep link; empty hides the link.
    uiUrl: ""
    # Trace retention in days (INQTRIX_TRACE_RETENTION_DAYS), enforced by
    # the worker's cleanup job against the Langfuse API (otlp mode only;
    # 0 disables). Empty keeps the application default (30).
    retentionDays: ""
    # mode "file" with worker.enabled needs ONE spool directory that api
    # and worker pods share, or the admin trace export never sees the
    # worker-written run spans. Name an existing RWX PersistentVolumeClaim
    # here; the chart then mounts it at /var/lib/inqtrix/traces in both
    # deployments and points INQTRIX_TRACE_SPOOL_DIR at it. Leaving it
    # empty in file mode with a worker is refused at render time.
    spoolClaim: ""
    # Recording DEPTH (OBSERVABILITY_PROFILE): summary | forensic.
    # forensic additionally records prompts, raw provider responses, tool
    # arguments and per-source search records — only meaningful with a
    # recording sink (mode file/otlp at sampleRate 1.0); the app warns at
    # startup otherwise. Empty keeps the application default (summary).
    profile: ""
    # Per-attribute content byte BACKSTOP (INQTRIX_TRACE_MAX_ATTR_BYTES).
    # Sized so it does not fire in normal operation; raise it rather than
    # accept truncated prompts. Empty keeps the default (1 MiB).
    maxAttrBytes: ""

  # -- Machine-readable stdout logs (INQTRIX_LOG_FORMAT=json). Recommended
  # for container runtimes: stdout then carries the full configured level
  # with the correlation envelope (request_id/run_id/user/trace_id), so a
  # log line and its trace join without a lookup. Empty keeps text.
  logFormat: ""

  # -- Retention for the two durable trails the worker prunes daily.
  # BOTH jobs live in the worker process: without worker.enabled these
  # values describe an intent, not an enforced policy. Empty keeps the
  # application defaults (audit 365 days, usage ledger 730 = 24 months);
  # 0 keeps rows forever.
  retention:
    auditDays: ""
    usageDays: ""

# -- API server (FastAPI, python -m inqtrix). Stateless; scale via replicaCount
# or autoscaling. Note: more than one replica requires the postgres storage
# backend (the in-memory run store is per-pod) -- see the guide's scaling note.
api:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Web UI (dependency-light Python web gateway serving the React bundle and
# reverse-proxying HTTP/WebSocket traffic on one origin). Stateless.
web:
  replicaCount: 1
  # -- Forwarded-scheme override for the Python web gateway ("" derives it from
  # chart-owned ingress/Route TLS settings). Set "https" when a TLS
  # terminator the chart does not own (own LoadBalancer, Gateway API,
  # service mesh) fronts the web Service. When INQTRIX_PUBLIC_BASE_URL is
  # explicit, this scheme must match it; the web gateway rejects a mismatch
  # at startup rather than forwarding contradictory origin metadata.
  externalScheme: ""
  # -- Extra environment for the web container (e.g. an explicit
  # INQTRIX_PROXY_MAX_BODY_BYTES when the derived default does not fit).
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Optional private editor collaboration service. Disabled by default. The
# browser never reaches this Service directly: the Python web gateway proxies
# /collaboration to FastAPI, whose gateway authenticates and relays to
# this single-writer process. The Deployment is intentionally fixed at one
# replica with Recreate strategy; there is no HPA, PDB, or persistence knob.
collaboration:
  enabled: false
  # A dedicated existing Secret may hold only the collaboration bearer value.
  # When empty, the chart uses the main app Secret selected by secret.* below.
  # In either Secret, `key` must contain at least 32 characters and must differ
  # from INQTRIX_SESSION_SECRET. The value is injected into API and Node but is
  # never rendered into a ConfigMap or command line.
  secret:
    existingSecret: ""
    key: INQTRIX_COLLABORATION_SECRET
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- Durable worker (inqtrix-worker). Requires INQTRIX_STORAGE_BACKEND=postgres
# AND a Valkey queue (INQTRIX_QUEUE_BACKEND=valkey + INQTRIX_VALKEY_URL); it
# fails loudly at startup otherwise. The worker shares the object store with the
# api, so when enabled use the S3 object-store backend -- a local-object-store
# PVC is ReadWriteOnce and cannot be shared with the api pod across nodes. Keep
# disabled for single-node setups.
worker:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- One-shot DB migration as a Helm hook running `inqtrix-migrate`; Helm blocks
# until it succeeds, so a failed migration fails the release. Hook phase depends
# on where the DB comes from: pre-install for an external DB (exists before the
# app), post-install when Postgres is bundled (created during install); always
# pre-upgrade. Only meaningful with the postgres storage backend. Disable to run
# migrations out-of-band.
migrations:
  enabled: true
  backoffLimit: 1
  # RLS authority used by inqtrix-migrate: auto (bundled/backwards-compatible),
  # owner (portable managed-Postgres maintenance), or bypass (a dedicated
  # BYPASSRLS role). Every installed-schema upgrade additionally requires
  # maintenanceConfirmed=true to authorize the chart's bounded pre-upgrade hook
  # to scale API/worker/collaboration to zero and drain their pools.
  rlsMode: auto
  maintenanceConfirmed: false
  # Schema upgrades render a pre-upgrade hook that removes the API HPA, scales
  # API/worker/collaboration to zero, and waits for their Pods to terminate
  # before the migration hook runs. The hook revokes its temporary RoleBinding
  # before exit. The normal Helm apply restores workloads after migration and,
  # with API autoscaling, writes minReplicas once to reactivate the HPA from 0.
  maintenanceTimeoutSeconds: 300
  # Dedicated Secret containing ONLY the direct migration DSN. It is required
  # for an external database when rlsMode is owner or bypass; the
  # backwards-compatible runtime URL fallback remains available only to
  # bundled Postgres and external auto-mode migrations. The name must differ
  # from secret.existingSecret (or the chart-managed application Secret).
  databaseSecret:
    name: ""
    key: INQTRIX_MIGRATION_DATABASE_URL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# -- Kubernetes Service ports. The collaboration port is ClusterIP-only and is
# not added to the public web Service or Ingress.
service:
  type: ClusterIP
  apiPort: 5100
  webPort: 8080
  collaborationPort: 1234

# -- Ingress (vanilla Kubernetes). Ignored when openshift.enabled=true (a Route
# is used there). The web Service is the single ingress target.
ingress:
  enabled: false
  className: ""
  # -- Ingress annotations are controller-specific, so the chart cannot set
  # them for you -- but with most controllers the DEFAULTS break Inqtrix:
  # ingress-nginx caps request bodies at 1m (every file upload > 1 MiB dies at
  # the ingress with a bare 413 before Inqtrix is ever reached, despite the
  # web pod's own 110m limit) and cuts responses idle for 60s (editor AI calls
  # block up to 630s, non-streaming chat completions up to 3630s, and chat SSE
  # emits no keepalive frames). For ingress-nginx start from:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "110m"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3630"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3630"
  # Raise proxy-body-size together with INQTRIX_MAX_FILE_BYTES and the
  # timeouts together with INQTRIX_MAX_TOTAL_SECONDS.
  annotations: {}
  host: inqtrix.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

# -- OpenShift Route. Rendered only when openshift.enabled=true AND route.enabled.
# The stock web container serves PLAIN HTTP on 8080, so `edge` (router terminates
# TLS, plaintext to the pod) is the only termination that works out of the box.
# `reencrypt` and `passthrough` fail rendering in this release instead of
# pretending to be certified.
route:
  enabled: true
  host: ""
  # -- Route annotations. The default raises the OpenShift router's 30-second
  # server timeout to the backend's own HTTP wait ceiling
  # (request_timeout_seconds = INQTRIX_MAX_TOTAL_SECONDS + 30s margin, 3630s
  # by default): editor AI calls block up to 630s and non-streaming chat
  # completions up to 3630s without sending a byte, and chat SSE emits no
  # keepalive frames, so the router default would cut them all at 30s. Raise
  # the timeout together with INQTRIX_MAX_TOTAL_SECONDS. WebSockets are
  # unaffected (HAProxy's tunnel timeout applies after the upgrade).
  annotations:
    haproxy.router.openshift.io/timeout: 3630s
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    # Reserved for a future separately certified reencrypt mode.
    destinationCACertificate: ""

# -- Object-store persistence for the local backend (single-replica / demo). When
# enabled a PVC is created and mounted at config.INQTRIX_OBJECT_STORE_PATH (the
# exact path the app writes to, so the mount and the app can never drift). A
# ReadWriteOnce PVC is not shared across nodes, so do NOT combine persistence with
# worker.enabled or more than one api replica unless they are co-located -- use
# the S3 object-store backend (config.INQTRIX_OBJECT_STORE_BACKEND=s3) for those.
# When disabled, an emptyDir is used (object-store data is lost on pod restart).
persistence:
  enabled: false
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# -- Pod-level security context. seccompProfile is always RuntimeDefault. On
# vanilla Kubernetes a fixed non-root UID and fsGroup are applied (see
# nonRootUid/fsGroup); on OpenShift (openshift.enabled=true) these are omitted so
# the SCC assigns an arbitrary UID with supplemental GID 0.
podSecurityContext: {}
nonRootUid: 1001
fsGroup: 1001

# -- Container-level security context (restricted-v2 compatible). The images run
# non-root, bind only ports >1024 (5100 / 8080) and write only to mounted
# emptyDir/PVC volumes, so a read-only root filesystem and dropping all
# capabilities are safe.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  # create=false is the strict BYO contract: name must identify an existing,
  # unannotated internal account and the chart creates no internal accounts.
  # API/worker may still select separately managed workload-identity accounts
  # via their component name overrides. Set name=default only deliberately.
  create: true
  name: ""
  annotations: {}
  # Per-workload overrides are additive. They let API/worker use an annotated
  # workload-identity ServiceAccount without granting cloud identity to web,
  # collaboration, migrations, or Helm tests. Empty names fall back to the
  # shared ServiceAccount above. annotations are accepted only with create=true;
  # externally managed account annotations belong on that external resource.
  api:
    create: false
    name: ""
    annotations: {}
    automountServiceAccountToken: false
  worker:
    create: false
    name: ""
    annotations: {}
    automountServiceAccountToken: false

# ---------------------------------------------------------------------------
# Optional bundled backing services (turnkey demo). Default OFF -> the app uses
# the external connections from `config` + `secret`. When enabled, the chart
# starts a minimal single-pod instance AND auto-wires the matching connection
# into the app (INQTRIX_DATABASE_URL / INQTRIX_QDRANT_URL+VECTOR_BACKEND+
# KNOWLEDGE_ENABLED / INQTRIX_QUEUE_BACKEND+VALKEY_URL / INQTRIX_OBJECT_STORE_BACKEND+
# S3_ENDPOINT_URL+S3_BUCKET+S3 keys) so a turnkey demo is one command. While a
# service is bundled, its service-specific values block is the only topology
# and credential source; parallel config/secret overrides fail rendering.
# If secret.existingSecret is set, the chart cannot write derived secret keys
# into that user-managed Secret; include the connection value and matching raw
# backing-service credential there yourself.
#
# All bundled services are single-pod, demo/dev ONLY (not highly available); for
# production on any platform prefer managed instances and leave these disabled.
#
# OpenShift: qdrant, valkey and s3 (minio) ARE OpenShift-compatible -- their
# podSecurityContext below is omitted automatically under openshift.enabled so the
# restricted-v2 SCC assigns an arbitrary UID + GID 0 (they write only to their data
# dir and need no /etc/passwd entry). The bundled POSTGRES is the exception: the
# official image's initdb needs the UID in /etc/passwd, so it keeps a fixed UID and
# runs on VANILLA Kubernetes only -- on OpenShift use an external/managed database
# (set INQTRIX_DATABASE_URL).
postgres:
  enabled: false
  image: docker.io/library/postgres:18.4-trixie@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
  imagePullPolicy: IfNotPresent
  auth:
    username: inqtrix
    # Embedded verbatim into INQTRIX_DATABASE_URL, so use only URL-unreserved
    # characters [A-Za-z0-9._~-] (the chart fails the render otherwise). For an
    # arbitrary password, use an external database with secret.data.INQTRIX_DATABASE_URL.
    password: ""
    database: inqtrix
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  # Vanilla-k8s security context (official postgres runs as uid 999). Empty it
  # ({}) only with an anyuid-class SCC; on OpenShift prefer an external database.
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Transaction-mode PgBouncer in front of the BUNDLED Postgres (requires
# postgres.enabled). When enabled, the app's derived INQTRIX_DATABASE_URL
# points at the pooler (with ?prepared_statement_cache_size=0 appended);
# the migrate hook keeps the DIRECT Postgres URL (DDL does not multiplex).
# An explicit secret.data.INQTRIX_DATABASE_URL always wins — external-DB
# deployments run their own pooler and point that URL wherever they like.
# The image is the CloudNativePG upstream PgBouncer package. Inqtrix supplies
# the configuration and creates a mode-0600 userlist from the chart Secret at
# runtime; no custom image is built.
pgbouncer:
  enabled: false
  image: ghcr.io/cloudnative-pg/pgbouncer:1.25.1-trixie@sha256:e6ddfe22d845e603825e235dd8334b21ecd125abea2a2172478f556b8dee2bb8
  imagePullPolicy: IfNotPresent
  poolMode: transaction
  maxClientConn: 400
  defaultPoolSize: 20
  # pgbouncer >= 1.21 tracks named prepared statements under transaction
  # pooling — required for asyncpg (belt-and-braces with the URL param).
  maxPreparedStatements: 200
  # The image runs as its own non-root user; nothing to pin. Omitted
  # automatically under openshift.enabled like the other bundled services.
  podSecurityContext:
    runAsUser: 998
    runAsGroup: 996
    fsGroup: 996
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

qdrant:
  enabled: false
  image: docker.io/qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
  imagePullPolicy: IfNotPresent
  # The chart runs the upstream image as a fixed non-root UID on vanilla
  # Kubernetes. The template therefore routes every mutable Qdrant path
  # (init marker, storage, snapshots, temp files) into the mounted storage
  # volume instead of the image-owned /qdrant directory.
  # Required when the bundled service is enabled. It is wired into both
  # Qdrant and the app as INQTRIX_QDRANT_API_KEY.
  apiKey: ""
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  # Vanilla-k8s only; omitted under openshift.enabled (SCC assigns UID + fsGroup).
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 2Gi

valkey:
  enabled: false
  image: docker.io/valkey/valkey:9.1.0@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
  imagePullPolicy: IfNotPresent
  # Embedded verbatim into INQTRIX_VALKEY_URL, so use only URL-unreserved
  # characters [A-Za-z0-9._~-] (the chart fails the render otherwise).
  password: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  # Vanilla-k8s only; omitted under openshift.enabled (SCC assigns UID + fsGroup).
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Bundled S3-compatible object store (MinIO) -- the turnkey equivalent of the
# Compose `--profile s3` SeaweedFS service. Enable for a self-contained object store
# on vanilla Kubernetes OR OpenShift (minio tolerates the restricted-v2 arbitrary
# UID); the bucket is created automatically on first upload. For production prefer
# external/managed S3 (set INQTRIX_OBJECT_STORE_BACKEND=s3 plus the S3_* config/secret
# yourself) and leave this disabled. Required by worker.enabled / multi-replica setups
# (a local PVC is ReadWriteOnce and not shared across pods).
s3:
  enabled: false
  image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  imagePullPolicy: IfNotPresent
  # MinIO root credentials ARE the S3 access/secret keys auto-wired into the app.
  # Unlike the DB/Valkey passwords these are sent as request credentials (not embedded
  # in a URL), so any value works; the secret key must be >= 8 characters (MinIO).
  accessKey: inqtrix
  secretKey: ""
  # Bucket the app uses; created automatically on first upload.
  bucket: inqtrix-files
  # Optional CA ConfigMap for a private external S3-compatible endpoint. This
  # mount is added only to API/worker and automatically sets
  # INQTRIX_S3_CA_BUNDLE to mountPath. It is also usable with enabled=false.
  caBundle:
    existingConfigMap: ""
    key: ca.crt
    mountPath: /etc/inqtrix/object-store/ca.crt
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  # Vanilla-k8s only; omitted under openshift.enabled (SCC assigns UID + fsGroup).
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
